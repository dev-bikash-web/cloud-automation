vnfd:
  description: vnfDesc
  df:
  - id: default-df
    instantiation-level:
    - id: default-instantiation-level
      vdu-level:
      - number-of-instances: 1
        vdu-id: vduid
    vdu-profile:
    - id: vduid
      min-number-of-instances: 1
    healing-aspect:
    - id: autohealid
      healing-policy:
      - vdu-id: vduid
        event-name: heal-alarm
        recovery-type: automatic
        action-on-recovery: REDEPLOY_ONLY
        cooldown-time: 180
        day1: false
  ext-cpd:
  - id: mgnt1-ext
    int-cpd:
      cpd: int1
      vdu-id: vduid
  id: vnfid
  mgmt-cp: mgnt1-ext
  product-name: vnfid
  provider: TATA ELXSI
  sw-image-desc:
  - id: imageName
    image: imageName
    name: imageName
  vdu:
  - alarm:
    - actions:
        alarm:
        - url: https://10.131.213.170:6001/v3_0/api/dataingestion/main_fm_teosm
        ok:
        - url: https://10.131.213.170:6001/v3_0/api/dataingestion/main_fm_teosm
      alarm-id: alarm-1
      operation: GT
      value: 60
      vnf-monitoring-param-ref: vnfid_cpu_util
    description: vduDesc
    id: vduid
    cloud-init: |
      #!/bin/sh
      hostnamectl set-hostname myHostname 
      sed -i 's/.*/myHostname/g' /etc/hostname
      echo "Setting Allowed Address Pair"
      myport=$(sshpass -pCONTROLLER_PASSWORD ssh -o StrictHostKeyChecking=no CONTROLLER_USER@CONTROLLER_IP ". USER_ENV; openstack port list --fixed-ip ip-address=$(hostname -I | awk '{print $1}')" | awk '{print $2}' | tail -2 | head -1)
      echo $myport
      sshpass -pCONTROLLER_PASSWORD ssh -o StrictHostKeyChecking=no CONTROLLER_USER@CONTROLLER_IP ". USER_ENV; openstack port set $myport --allowed-address ip-address=PGW_ADDRPAIR_CP/PGW_SUBLEN_CP"

      echo "Execution of  PGW Node User data"
      cd /root/
      sed -i -e  "s/PasswordAuthentication no/PasswordAuthentication yes/" /etc/ssh/sshd_config
      /sbin/service sshd restart
      # Fetching files. 
      echo "Fetching files from controller."
      lftp sftp://cdot:cdot@1234@10.145.51.250 -e "cd /home/cdot/CHDCLOUD/PB/LTEEPC1; mget EPC/NFV/lte_epc.cfg; mget EPC/NFV/scripts/configure_pgw.sh; mget EPC/NFV/replacevars.sh; bye"
      chmod +x replacevars.sh
      echo "Replacing tags in PGW configuration file (configure_pgw.sh)."
      ./replacevars.sh 275 "pgw"
      chmod +x configure_pgw.sh
      echo "Executing configure_pgw.sh"
      ./configure_pgw.sh

    int-cpd:
    - id: int1
      virtual-network-interface-requirement:
      - name: eth0
        position: 1
        virtual-interface:
          type: PARAVIRT
    monitoring-parameter:
    - id: vnfid_cpu_util
      name: vnfid_cpu_util
      performance-metric: cpu_utilization
    - id: vnfid_memory_util
      name: vnfid_memory_util
      performance-metric: average_memory_utilization
    - id: vnfid_packets_sent
      name: vnfid_packets_sent
      performance-metric: packets_sent
    - id: vnfid_packets_received
      name: vnfid_packets_received
      performance-metric: packets_received
    - id: vnfid_disk_read_ops
      name: vnfid_disk_read_ops
      performance-metric: disk_read_ops
    - id: vnfid_pdisk_write_ops
      name: vnfid_disk_write_ops
      performance-metric: disk_write_ops
    - id: vnfid_disk_read_bytes
      name: vnfid_disk_read_bytes
      performance-metric: disk_read_bytes
    - id: vnfid_disk_write_bytes
      name: vnfid_disk_write_bytes
      performance-metric: disk_write_bytes
    - id: vnfid_packets_in_dropped
      name: vnfid_packets_in_dropped
      performance-metric: packets_in_dropped
    - id: vnfid_packets_out_dropped
      name: vnfid_packets_out_dropped
      performance-metric: packets_out_dropped
    name: vduName
    sw-image-desc: imageName
    virtual-compute-desc: vduid-compute
    virtual-storage-desc:
    - vduid-storage
  version: '1.0'
  software-version: '2.0'
  virtual-compute-desc:
  - id: vduid-compute
    virtual-cpu:
      num-virtual-cpu: vx
    virtual-memory:
      size: mx
  virtual-storage-desc:
  - id: vduid-storage
    size-of-storage: sx
