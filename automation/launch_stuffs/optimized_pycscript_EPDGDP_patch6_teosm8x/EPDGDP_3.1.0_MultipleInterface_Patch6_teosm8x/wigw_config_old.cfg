epdgcp-node1-ipv4 = 12.24.21.8
epdgcp-node2-ipv4 = 12.24.21.9
maximum-subscriber = 20000
# Add prefix length to subnets
pcscf-subnet = 12.24.22.0/24
imsdp-subnet = 12.24.23.0/24
