##***NODE CONFIG STARTS HERE***##
#node-name from : {firewall, dpi, cgnat, secgw, cips, imsdp, hhe, epdgdp}

[CFG_VERSION]
version = 1.4.0

[default]
node-name = epdgdp
mgmt-ipv4 = 172.23.138.20
mgmt-gw-ipv4 = 172.23.138.1
mgmt-ipv6 = 10::10
mgmt-gw-ipv6 = 10::1
#management-int-name is fixed, DO NOT CHANGE
management-int-name = ens3
# CUPS interface IP on ePDG-DP
# Add prefix length to ip address
ctrl-ipv4 = 172.23.133.9/24
ctrl-gw-ipv4 = 172.23.133.1
ctrl-interface-name = ens4

#For configuring the SWu interface
[fast_path_if_1]
if_name = dp0s20
vlan_id = 80
# Add prefix length to ip address
if-ipv4 = 172.24.11.10/24
if-ipv6 = 11::10/64

#For configuring the S2b/gtp-u interface
[fast_path_if_2]
if_name = dp0s21
vlan_id = 81
# Add prefix length to ip address
if-ipv4 = 172.24.12.10/24
if-ipv6 = 12::10/64

[static_route_ipv4_1]
#For configuring the ipv4 static default route (towards AP/UE) for Swu interface
# Add prefix length to route
route-ipv4 = 0.0.0.0/0
next-hop-ipv4 = 172.24.11.1

[static_route_ipv4_2]
#For configuring the ipv4 static route to PGW-DP for S2b interface
# Add prefix length to route
route-ipv4 = 172.24.23.0/24
next-hop-ipv4 = 172.24.12.1

#For configuring the ssh port
[ssh]
port = 222
local-usr-ssh-port = 22

[snmp]
listen-address-ipv4 = 172.23.138.20
trap-target-ipv4 = 1.1.1.1
#For configuring the access-site interface
#uncomment this block when running in local setup
#node-type = EPDGDP
#device-name = EPDGDP1
#region-name = NZ::DL
#my-ipv4 = 192.168.122.79
#peer-ipv4 = 0.0.0.0
#vip-ipv4 = 0.0.0.0
#my-ipv6 = 2001:db8::123.123.123.123
#peer-ipv6 = 2001:db8::1234:5678:5.6.7.8
#geosite-type = PR
#peer-host-name = None
#self-host-name = None
#pr1-ipv4 = 0.0.0.0
#pr2-ipv4 = 0.0.0.0
#gr1-ipv4 = 0.0.0.0
#gr2-ipv4 = 0.0.0.0

#For configuring the tacacs server details
[tacacs_1]
tacacs-server-ipv4 = 192.168.173.62
port = 49
password = testing123

#For configuring the sts server details
[sts]
control-address-ipv4 = 192.168.176.53
control-port = 8020
data-address-ipv4 = 192.168.176.53
data-port = 8020
self-ipv4 = 192.168.237.52
access-interface = dp0s20
pdn-interface = dp0s21

#For configuring the syslog
[syslog_1]
host-ipv4 = 192.168.111.79
port = 514

#For configuring the backup restoration
[backup_restoration]
route-ipv4 = 1.1.1.1/32
next-hop-ipv4 = 2.2.2.2

#For configuring the ntp server details
[ntp_1]
ntp-server-ipv4 = 192.168.111.79
# min-max poll range (3-11)
min-poll = 3
max-poll = 5

#For configuring the os hardening details
[os_hardening]
login-attempts = 3
login-duration = 60
login-session-timeout = 600
password-length = 8
password-min-class = 3
max-sessions = 50

##***EPDGDP SPECIFIC CONFIG STARTS HERE***##

[epdg_ipsec_profile]
#auth-id = ims
tunnel-local-prefix-ipv4 = 0.0.0.0/0
tunnel-remote-prefix-ipv4 = 0.0.0.0/0
