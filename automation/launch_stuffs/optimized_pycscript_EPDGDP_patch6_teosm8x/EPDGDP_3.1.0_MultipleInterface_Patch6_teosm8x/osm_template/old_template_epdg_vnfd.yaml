vnfd-catalog:
    schema-version: "v3.0"
    vnfd:
    -   id: "vnfid"
        name: "vnfName"
        short-name: "vnfShortName"
        description: "vnfDesc"
        vendor: TATA ELXSI
        version: '1.0'

        # Management interface
        connection-point:
        -   id: mgnt1
            name: mgnt1
            short-name: mgnt1

        -   id: mgnt2
            name: mgnt2
            short-name: mgnt2

        mgmt-interface:
            cp: mgnt1

        monitoring-param:
        -   aggregation-type: AVERAGE
            id: vnfid_cpu_util
            name: vnfid_cpu_util
            vdu-monitoring-param:
                vdu-monitoring-param-ref: vduid_cpu_util
                vdu-ref: vduid
        -   aggregation-type: AVERAGE
            id: vnfid_memory_util
            name: vnfid_memory_util
            vdu-monitoring-param:
                vdu-monitoring-param-ref: vduid_memory_util
                vdu-ref: vduid
        -   aggregation-type: AVERAGE
            id: vnfid_disk_read_ops
            name: vnfid_disk_read_ops
            vdu-monitoring-param:
                vdu-monitoring-param-ref: vduid_disk_read_ops
                vdu-ref: vduid
        -   aggregation-type: AVERAGE
            id: vnfid_disk_write_ops
            name: vnfid_disk_write_ops
            vdu-monitoring-param:
                vdu-monitoring-param-ref: vduid_disk_write_ops
                vdu-ref: vduid
        -   aggregation-type: AVERAGE
            id: vnfid_disk_read_bytes
            name: vnfid_disk_read_bytes
            vdu-monitoring-param:
                vdu-monitoring-param-ref: vduid_disk_read_bytes
                vdu-ref: vduid
        -   aggregation-type: AVERAGE
            id: vnfid_disk_write_bytes
            name: vnfid_disk_write_bytes
            vdu-monitoring-param:
                vdu-monitoring-param-ref: vduid_disk_write_bytes
                vdu-ref: vduid
        -   aggregation-type: AVERAGE
            id: vnfid_packets_sent
            name: vnfid_packets_sent
            vdu-monitoring-param:
                vdu-monitoring-param-ref: vduid_packets_sent
                vdu-ref: vduid
        -   aggregation-type: AVERAGE
            id: vnfid_packets_received
            name: vnfid_packets_received
            vdu-monitoring-param:
                vdu-monitoring-param-ref: vduid_packets_received
                vdu-ref: vduid
        -   aggregation-type: AVERAGE
            id: vnfid_packets_in_dropped
            name: vnfid_packets_in_dropped
            vdu-monitoring-param:
                vdu-monitoring-param-ref: vduid_packets_in_dropped
                vdu-ref: vduid
        -   aggregation-type: AVERAGE
            id: vnfid_packets_out_dropped
            name: vnfid_packets_out_dropped
            vdu-monitoring-param:
                vdu-monitoring-param-ref: vduid_packets_out_dropped
                vdu-ref: vduid

        # At least one VDU need to be specified
        vdu:
        # Additional VDUs can be created by copying the
        # VDU descriptor below
        -   alarm:
            -   alarm-id: alarm-1
                operation: GT
                value: 60
                actions:
                  alarm:
                    - url: CNOPS_IP
                  ok:
                    - url: CNOPS_IP
                  insufficient-data:
                    - url: CNOPS_IP
                vnf-monitoring-param-ref: vnfid_cpu_util
            id: "vduid"
            name: "vduName"
            description: "vduDesc"
            count: 1
            cloud-init: | 
              #!/bin/sh
              hostname myHostname
              sed -i 's/.*/myHostname/g' /etc/hostname
              # Setting Allowed Address Pair
              echo "Set Allowed Address Pair Manually"
              #myport=$(sshpass -pCONTROLLER_PASSWORD ssh -o StrictHostKeyChecking=no CONTROLLER_USER@CONTROLLER_IP ". /home/cdot/admin-openrc; openstack port list --fixed-ip ip-address=$(hostname -I | awk '{print $1}')" | awk '{print $2}' | tail -2 | head -1)
              #echo $myport
              #sshpass -pCONTROLLER_PASSWORD ssh -o StrictHostKeyChecking=no CONTROLLER_USER@CONTROLLER_IP ". /home/cdot/admin-openrc; openstack port set $myport --allowed-address ip-address=ADDRPAIR"

              #  Fetching files.
              echo "Execution of CFW Node 1 User data"
              cd /root/
              ssh-keyscan -t rsa CONTROLLER_IP >> /root/.ssh/known_hosts
              sed -i -e  "s/PasswordAuthentication no/PasswordAuthentication yes/" /etc/ssh/sshd_config
              service sshd restart
              # Fetching files.
              echo "Fetching files from controller."
              lftp sftp://CONTROLLER_USER:CONTROLLER_PASSWORD@CONTROLLER_IP -e "set ftp:ssl-allow no; set xfer:clobber on; cd CFW_NFV_BASE_SUB_PATH; mget CFW_NFV_CONTROLLER_DIR/NFV/cfw_config.cfg; mget CFW_NFV_CONTROLLER_DIR/NFV/configure_cfw.sh; mget CFW_NFV_CONTROLLER_DIR/NFV/replacevars.sh; bye"
              chmod +x replacevars.sh
              echo "Replacing tags in CFW 1 configuration file (configure_cfw.sh)."
              ./replacevars.sh 275 "cfw"
              chmod +x configure_cfw.sh
              echo "Executing configure_cfw.sh"
              ./configure_cfw.sh


            # Flavour of the VM to be instantiated for the VDU
            vm-flavor:
                vcpu-count: "vx" 
                memory-mb: "mx"
                storage-gb: "sx" 

            # Image including the full path
            image: "imageName"

            interface:
            # Specify the external interfaces
            # There can be multiple interfaces defined
            -   name: eth0
                type: EXTERNAL
                virtual-interface:
                    type: PARAVIRT
                external-connection-point-ref: mgnt1
            -   name: eth1
                type: EXTERNAL
                virtual-interface:
                    type: PARAVIRT
                external-connection-point-ref: mgnt2
            monitoring-param:
            -   id: vduid_cpu_util
                nfvi-metric: cpu_utilization
            -   id: vduid_memory_util
                nfvi-metric: average_memory_utilization
            -   id: vduid_disk_read_ops
                nfvi-metric: disk_read_ops
            -   id: vduid_disk_write_ops
                nfvi-metric: disk_write_ops
            -   id: vduid_disk_read_bytes
                nfvi-metric: disk_read_bytes
            -   id: vduid_disk_write_bytes
                nfvi-metric: disk_write_bytes
            -   id: vduid_packets_sent
                nfvi-metric: packets_sent
            -   id: vduid_packets_received
                nfvi-metric: packets_received
            -   id: vduid_packets_in_dropped
                nfvi-metric: packets_in_dropped
            -   id: vduid_packets_out_dropped
                nfvi-metric: packets_out_dropped

            heal:
                heal-alarm-id: heal_alarm
                heal-policy: automatic
                heal-type: respawn
                cooldown-time: 600
