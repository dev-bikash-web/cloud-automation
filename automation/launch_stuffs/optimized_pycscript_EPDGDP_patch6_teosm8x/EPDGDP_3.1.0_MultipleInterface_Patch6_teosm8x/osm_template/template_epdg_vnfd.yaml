vnfd:
  description: "vnfDesc"
  df:
  - id: default-df
    instantiation-level:
    - id: default-instantiation-level
      vdu-level:
      - number-of-instances: 1
        vdu-id: "vduid"
    vdu-profile:
    - id: "vduid"
      min-number-of-instances: 1
    healing-aspect:
    -   id: "autohealid"
        healing-policy:
        - vdu-id: "vduid"
          event-name: heal-alarm
          recovery-type: automatic
          action-on-recovery: REDEPLOY_ONLY
          cooldown-time: 180
          day1: false
  ext-cpd:
  - id: mgnt1-ext
    int-cpd:
      cpd: int1
      vdu-id: "vduid"
  - id: mgnt2-ext
    int-cpd:
      cpd: int2
      vdu-id: "vduid"
  id: "vnfid"
  mgmt-cp: mgnt1-ext
  product-name: "vnfid"
  provider: TATA ELXSI
  sw-image-desc:
  - id: "imageName"
    image: "imageName"
    name: "imageName"
  vdu:
  - alarm:
    - actions:
        alarm:
        - url: CNOPS_IP
        insufficient-data:
        - url: CNOPS_IP
        ok:
        - url: CNOPS_IP
      alarm-id: alarm-1
      operation: GT
      value: 60
      vnf-monitoring-param-ref: vnfid_cpu_util
    description: "vduDesc"
    id: "vduid"
    cloud-init: |
              #!/bin/sh
              hostname myHostname
              sed -i 's/.*/myHostname/g' /etc/hostname
              # Fetching files.
              /bin/echo " VNF deployment is starting. "
              release_server=CONTROLLER_IP
              rel_name=ENUM_Application
              rel_file="$rel_name"REL_FILE.tgz
              rel_path=REL_PATH
              rel_user_name=CONTROLLER_USER
              rel_passwd=CONTROLLER_PASSWORD

              cd /home/myVNF/ENUM_REL/ENUM_NEW
              /bin/rm -rf *

              /bin/echo " Taking release file from release server $release_server"
              /bin/mkdir -p /root/.ssh
              /usr/bin/ssh-keyscan -t rsa $release_server >> /root/.ssh/known_hosts
              # Setting Allowed Address Pair
              echo "Setting Allowed Address Pair"
              myport=$(sshpass -pCONTROLLER_PASSWORD ssh -o StrictHostKeyChecking=no CONTROLLER_USER@CONTROLLER_IP ". /home/cdot/admin-openrc; openstack port list --fixed-ip ip-address=$(hostname -I | awk '{print $1}')" | awk '{print $2}' | tail -2 | head -1)
              echo $myport
              sshpass -pCONTROLLER_PASSWORD ssh -o StrictHostKeyChecking=no CONTROLLER_USER@CONTROLLER_IP ". /home/ubuntu/admin-openrc; openstack port set $myport --allowed-address ip-address=ADDRPAIR"
              lftp sftp://$rel_user_name:$rel_passwd@$release_server -e "set ftp:ssl-allow no; cd $rel_path; get $rel_file; get myVNF_configure.sh; bye"
              sleep 5
              /bin/echo " === making script executable  ==== "
              /bin/chmod +x myVNF_configure.sh

              #/bin/echo " === Extracting release tar file  ==== "
              #/bin/su myVNF -c "/bin/tar zxvf $rel_file"
              Node_Id=NODE_ID
              /bin/echo " Configuration and installation of ENUM Application at node $Node_Id. "
              if [ -f myVNF_configure.sh ]; then
                ./myVNF_configure.sh $Node_Id
                /bin/echo " Configuration and release installation of ENUM Application is done."
              else
                /bin/echo " Error- myVNF_configure.sh script file is not found. Cannot proceed for installation of ENUM Application"
              fi

    int-cpd:
    - id: int1
      virtual-network-interface-requirement:
      - name: eth0
        position: 1
        virtual-interface:
          type: PARAVIRT
    - id: int2
      virtual-network-interface-requirement:
      - name: eth1
        position: 2
        virtual-interface:
          type: PARAVIRT

    monitoring-parameter:
    - id: vnfid_cpu_util
      name: vnfid_cpu_util
      performance-metric: cpu_utilization
    - id: vnfid_memory_util
      name: vnfid_memory_util
      performance-metric: average_memory_utilization
    - id: vnfid_packets_sent
      name: vnfid_packets_sent
      performance-metric: packets_sent
    - id: vnfid_packets_received
      name: vnfid_packets_received
      performance-metric: packets_received
    - id: vnfid_disk_read_ops
      name: vnfid_disk_read_ops
      performance-metric: disk_read_ops
    - id: vnfid_pdisk_write_ops
      name: vnfid_disk_write_ops
      performance-metric: disk_write_ops
    - id: vnfid_disk_read_bytes
      name: vnfid_disk_read_bytes
      performance-metric: disk_read_bytes
    - id: vnfid_disk_write_bytes
      name: vnfid_disk_write_bytes
      performance-metric: disk_write_bytes
    - id: vnfid_packets_in_dropped
      name: vnfid_packets_in_dropped
      performance-metric: packets_in_dropped
    - id: vnfid_packets_out_dropped
      name: vnfid_packets_out_dropped
      performance-metric: packets_out_dropped
    name: "vduName"
    sw-image-desc: "imageName"
    virtual-compute-desc: vduid-compute
    virtual-storage-desc:
    - vduid-storage
  version: '1.0'
  software-version: '2.0'
  virtual-compute-desc:
  - id: vduid-compute
    virtual-cpu:
      num-virtual-cpu: "vx"
    virtual-memory:
      size: "mx"
  virtual-storage-desc:
  - id: vduid-storage
    size-of-storage: "sx"
