vnfd-catalog:
    schema-version: "v3.0"
    vnfd:
    -   id: "vnfid"
        name: "vnfName"
        short-name: "vnfShortName"
        description: "vnfDesc"
        vendor: TATA ELXSI
        version: '1.0'

        # Management interface
        mgmt-interface:
            cp: mgnt1

        monitoring-param:
        -   aggregation-type: AVERAGE
            id: vnfid_cpu_util
            name: vnfid_cpu_util
            vdu-monitoring-param:
                vdu-monitoring-param-ref: vduid_cpu_util
                vdu-ref: vduid
        -   aggregation-type: AVERAGE
            id: vnfid_memory_util
            name: vnfid_memory_util
            vdu-monitoring-param:
                vdu-monitoring-param-ref: vduid_memory_util
                vdu-ref: vduid
        -   aggregation-type: AVERAGE
            id: vnfid_disk_read_ops
            name: vnfid_disk_read_ops
            vdu-monitoring-param:
                vdu-monitoring-param-ref: vduid_disk_read_ops
                vdu-ref: vduid
        -   aggregation-type: AVERAGE
            id: vnfid_disk_write_ops
            name: vnfid_disk_write_ops
            vdu-monitoring-param:
                vdu-monitoring-param-ref: vduid_disk_write_ops
                vdu-ref: vduid
        -   aggregation-type: AVERAGE
            id: vnfid_disk_read_bytes
            name: vnfid_disk_read_bytes
            vdu-monitoring-param:
                vdu-monitoring-param-ref: vduid_disk_read_bytes
                vdu-ref: vduid
        -   aggregation-type: AVERAGE
            id: vnfid_disk_write_bytes
            name: vnfid_disk_write_bytes
            vdu-monitoring-param:
                vdu-monitoring-param-ref: vduid_disk_write_bytes
                vdu-ref: vduid
        -   aggregation-type: AVERAGE
            id: vnfid_packets_sent
            name: vnfid_packets_sent
            vdu-monitoring-param:
                vdu-monitoring-param-ref: vduid_packets_sent
                vdu-ref: vduid
        -   aggregation-type: AVERAGE
            id: vnfid_packets_received
            name: vnfid_packets_received
            vdu-monitoring-param:
                vdu-monitoring-param-ref: vduid_packets_received
                vdu-ref: vduid
        -   aggregation-type: AVERAGE
            id: vnfid_packets_in_dropped
            name: vnfid_packets_in_dropped
            vdu-monitoring-param:
                vdu-monitoring-param-ref: vduid_packets_in_dropped
                vdu-ref: vduid
        -   aggregation-type: AVERAGE
            id: vnfid_packets_out_dropped
            name: vnfid_packets_out_dropped
            vdu-monitoring-param:
                vdu-monitoring-param-ref: vduid_packets_out_dropped
                vdu-ref: vduid


        # At least one VDU need to be specified
        vdu:
        # Additional VDUs can be created by copying the
        # VDU descriptor below
        -   alarm:
            -   alarm-id: alarm-1
                operation: GT
                value: 60
                actions:
                  alarm:
                    - url: CNOPS_IP
                  ok:
                    - url: CNOPS_IP
                  insufficient-data:
                    - url: CNOPS_IP
                vnf-monitoring-param-ref: vnfid_cpu_util
            id: "vduid"
            name: "vduName"
            description: "vduDesc"
            count: 1
            cloud-init: | 
                #!/bin/sh
                # Fetching files.
                hostname myHostname 
                sed -i 's/.*/myHostname/g' /etc/hostname
                
                echo "Setting Allowed Address Pair"
                myport=$(sshpass -pCONTROLLER_PASSWORD ssh -o StrictHostKeyChecking=no CONTROLLER_USER@CONTROLLER_IP ". USER_ENV; openstack port list --fixed-ip ip-address=$(hostname -I | awk \'{print $1}\')" | awk \'{print $2}\' | tail -2 | head -1)
                echo $myport
                sshpass -pCONTROLLER_PASSWORD ssh -o StrictHostKeyChecking=no CONTROLLER_USER@CONTROLLER_IP ". USER_ENV; openstack port set $myport --allowed-address ip-address=ADDRPAIR/SUBLEN"
                /bin/echo " VNF deployment is starting. "
                release_server=_SYSTEM_CONTROLLER_IP
                rel_path="_RELEASE_FILE_PATH"
                rel_user_name=_SYSTEM_CONTROLLER_USER
                rel_passwd=_SYSTEM_CONTROLLER_PASSWORD

                cd /home/dns/PROJECT_REL/PROJECT_NEW
                /bin/rm -rf *

                /bin/echo " Taking release file from release server $release_server"
                /bin/mkdir -p /root/.ssh
                /usr/bin/ssh-keyscan -t rsa $release_server >> /root/.ssh/known_hosts
                lftp sftp://$rel_user_name:$rel_passwd@$release_server -e "set ftp:ssl-allow no; cd $rel_path; mget nodes.cfg; mget scripts/node_configure.sh; mget replacevars.sh; bye"
                sleep 5
                chmod +x replacevars.sh
                echo " Replacing tags in configuration file (node_configure.sh)."
                ./replacevars.sh 275

                /bin/echo " === making scripts executable  ==== "
                /bin/chmod +x node_configure.sh

                Node_Id=1
                /bin/echo " Configuration and installation of Application at node $Node_Id. "
                if [ -f node_configure.sh ]; then
                        ./node_configure.sh $Node_Id
                        /bin/echo " Configuration and release installation of  Application is done."
                else
                        /bin/echo " Error- node_configure.sh script file is not found. Cannot proceed for installation of Application"
                fi

            # Flavour of the VM to be instantiated for the VDU
            vm-flavor:
                vcpu-count: "vx" 
                memory-mb: "mx"
                storage-gb: "sx" 

            # Image including the full path
            image: "imageName"

            interface:
            # Specify the external interfaces
            # There can be multiple interfaces defined
            -   name: eth0
                type: EXTERNAL
                virtual-interface:
                    type: PARAVIRT
                external-connection-point-ref: mgnt

            monitoring-param:
            -   id: vduid_cpu_util
                nfvi-metric: cpu_utilization
            -   id: vduid_memory_util
                nfvi-metric: average_memory_utilization
            -   id: vduid_disk_read_ops
                nfvi-metric: disk_read_ops
            -   id: vduid_disk_write_ops
                nfvi-metric: disk_write_ops
            -   id: vduid_disk_read_bytes
                nfvi-metric: disk_read_bytes
            -   id: vduid_disk_write_bytes
                nfvi-metric: disk_write_bytes
            -   id: vduid_packets_sent
                nfvi-metric: packets_sent
            -   id: vduid_packets_received
                nfvi-metric: packets_received
            -   id: vduid_packets_in_dropped
                nfvi-metric: packets_in_dropped
            -   id: vduid_packets_out_dropped
                nfvi-metric: packets_out_dropped

            heal:
                heal-alarm-id: heal_alarm
                heal-policy: automatic
                heal-type: respawn
                cooldown-time: 600

        connection-point:
        -   name: mgnt

