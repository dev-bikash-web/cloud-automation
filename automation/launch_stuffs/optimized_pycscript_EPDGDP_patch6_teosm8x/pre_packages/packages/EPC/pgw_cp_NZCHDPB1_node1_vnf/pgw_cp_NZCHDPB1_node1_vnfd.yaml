vnfd:
  description: PGW_CP_NODE1 VNFD package enabled with Day-0 and Service Assurance
  df:
  - id: default-df
    instantiation-level:
    - id: default-instantiation-level
      vdu-level:
      - number-of-instances: 1
        vdu-id: pgw_cp_NZCHDPB1_node1_vnfd-VM
    vdu-profile:
    - id: pgw_cp_NZCHDPB1_node1_vnfd-VM
      min-number-of-instances: 1
    healing-aspect:
    - id: pgw_cp_NZCHDPB1_node1_vnfd-VM_autoheal
      healing-policy:
      - vdu-id: pgw_cp_NZCHDPB1_node1_vnfd-VM
        event-name: heal-alarm
        recovery-type: automatic
        action-on-recovery: REDEPLOY_ONLY
        cooldown-time: 180
        day1: false
  ext-cpd:
  - id: mgnt1-ext
    int-cpd:
      cpd: int1
      vdu-id: pgw_cp_NZCHDPB1_node1_vnfd-VM
  id: pgw_cp_NZCHDPB1_node1_vnfd
  mgmt-cp: mgnt1-ext
  product-name: pgw_cp_NZCHDPB1_node1_vnfd
  provider: TATA ELXSI
  sw-image-desc:
  - id: LTEEPC-CENTOS6.10-EPC-4.13.0
    image: LTEEPC-CENTOS6.10-EPC-4.13.0
    name: LTEEPC-CENTOS6.10-EPC-4.13.0
  vdu:
  - alarm:
    - actions:
        alarm:
        - url: https://10.131.213.170:6001/v3_0/api/dataingestion/main_fm_teosm
        ok:
        - url: https://10.131.213.170:6001/v3_0/api/dataingestion/main_fm_teosm
      alarm-id: alarm-1
      operation: GT
      value: 60
      vnf-monitoring-param-ref: pgw_cp_NZCHDPB1_node1_vnfd_cpu_util
    description: pgw_cp_NZCHDPB1_node1_vnfd-VM
    id: pgw_cp_NZCHDPB1_node1_vnfd-VM
    cloud-init: |
      #!/bin/sh
      hostnamectl set-hostname PGW-NZCHDPB1-1 
      sed -i 's/.*/PGW-NZCHDPB1-1/g' /etc/hostname
      echo "Setting Allowed Address Pair"
      myport=$(sshpass -pcdot@1234 ssh -o StrictHostKeyChecking=no cdot@10.45.51.250 ". /home/cdot/admin-openrc; openstack port list --fixed-ip ip-address=$(hostname -I | awk '{print $1}')" | awk '{print $2}' | tail -2 | head -1)
      echo $myport
      sshpass -pcdot@1234 ssh -o StrictHostKeyChecking=no cdot@10.45.51.250 ". /home/cdot/admin-openrc; openstack port set $myport --allowed-address ip-address=10.145.45.0/24"

      echo "Execution of  PGW Node User data"
      cd /root/
      sed -i -e  "s/PasswordAuthentication no/PasswordAuthentication yes/" /etc/ssh/sshd_config
      /sbin/service sshd restart
      # Fetching files. 
      echo "Fetching files from controller."
      lftp sftp://cdot:cdot@1234@10.145.51.250 -e "cd /home/cdot/CHDCLOUD/PB/LTEEPC1; mget EPC/NFV/lte_epc.cfg; mget EPC/NFV/scripts/configure_pgw.sh; mget EPC/NFV/replacevars.sh; bye"
      chmod +x replacevars.sh
      echo "Replacing tags in PGW configuration file (configure_pgw.sh)."
      ./replacevars.sh 275 "pgw"
      chmod +x configure_pgw.sh
      echo "Executing configure_pgw.sh"
      ./configure_pgw.sh

    int-cpd:
    - id: int1
      virtual-network-interface-requirement:
      - name: eth0
        position: 1
        virtual-interface:
          type: PARAVIRT
    monitoring-parameter:
    - id: pgw_cp_NZCHDPB1_node1_vnfd_cpu_util
      name: pgw_cp_NZCHDPB1_node1_vnfd_cpu_util
      performance-metric: cpu_utilization
    - id: pgw_cp_NZCHDPB1_node1_vnfd_memory_util
      name: pgw_cp_NZCHDPB1_node1_vnfd_memory_util
      performance-metric: average_memory_utilization
    - id: pgw_cp_NZCHDPB1_node1_vnfd_packets_sent
      name: pgw_cp_NZCHDPB1_node1_vnfd_packets_sent
      performance-metric: packets_sent
    - id: pgw_cp_NZCHDPB1_node1_vnfd_packets_received
      name: pgw_cp_NZCHDPB1_node1_vnfd_packets_received
      performance-metric: packets_received
    - id: pgw_cp_NZCHDPB1_node1_vnfd_disk_read_ops
      name: pgw_cp_NZCHDPB1_node1_vnfd_disk_read_ops
      performance-metric: disk_read_ops
    - id: pgw_cp_NZCHDPB1_node1_vnfd_pdisk_write_ops
      name: pgw_cp_NZCHDPB1_node1_vnfd_disk_write_ops
      performance-metric: disk_write_ops
    - id: pgw_cp_NZCHDPB1_node1_vnfd_disk_read_bytes
      name: pgw_cp_NZCHDPB1_node1_vnfd_disk_read_bytes
      performance-metric: disk_read_bytes
    - id: pgw_cp_NZCHDPB1_node1_vnfd_disk_write_bytes
      name: pgw_cp_NZCHDPB1_node1_vnfd_disk_write_bytes
      performance-metric: disk_write_bytes
    - id: pgw_cp_NZCHDPB1_node1_vnfd_packets_in_dropped
      name: pgw_cp_NZCHDPB1_node1_vnfd_packets_in_dropped
      performance-metric: packets_in_dropped
    - id: pgw_cp_NZCHDPB1_node1_vnfd_packets_out_dropped
      name: pgw_cp_NZCHDPB1_node1_vnfd_packets_out_dropped
      performance-metric: packets_out_dropped
    name: pgw_cp_NZCHDPB1_node1_vnfd-VM
    sw-image-desc: LTEEPC-CENTOS6.10-EPC-4.13.0
    virtual-compute-desc: pgw_cp_NZCHDPB1_node1_vnfd-VM-compute
    virtual-storage-desc:
    - pgw_cp_NZCHDPB1_node1_vnfd-VM-storage
  version: '1.0'
  software-version: '2.0'
  virtual-compute-desc:
  - id: pgw_cp_NZCHDPB1_node1_vnfd-VM-compute
    virtual-cpu:
      num-virtual-cpu: 16
    virtual-memory:
      size: 96
  virtual-storage-desc:
  - id: pgw_cp_NZCHDPB1_node1_vnfd-VM-storage
    size-of-storage: 100
