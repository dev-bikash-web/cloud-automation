##***NODE CONFIG STARTS HERE***##
#node-name from : {firewall, dpi, cgnat, secgw, cips, imsdp, hhe, epdgdp}

[CFG_VERSION]
version = 3.1.0

#                             +---------------------+
#                             |      EPDG-CP        |
#                             | node_1=172.24.21.8  |
#                             | node_2=172.24.21.9  |
#                             +---------------------+
#                        CUPS-cp-ip=     ^
#                       172.24.21.10     |
#                                        |
#                                        |
#                                        |
#                                        |
#                                        |
#                         CUPS-dp-ip=    |
#                        172.24.13.10    v
# +--------+                  +---------------------+                  +-------------------------+
# |   AP   |<---------------> |      EPDG-DP        | <--------------> |   PGW-DP                |
# +--------+     SWu          |                     |      S2b         | subnet=172.24.23.0/24   |
#     ^                       +---------------------+                  +-------------------------+
#     |
#     |                   ESP-IP=                GTP-u IP=
#     |                172.24.11.10/24         172.24.12.10/24
#     |
#     |
#     v
#+-------------+
#|     UE      |
#+-------------+

[default]
node-name = epdgdp
mgmt-ipv4 = 172.23.138.189
mgmt-gw-ipv4 = 172.23.138.1
mgmt-ipv6 = 10::10
mgmt-gw-ipv6 = 10::1
#management-int-name is fixed, DO NOT CHANGE
management-int-name = eth0
# CUPS interface IP on ePDG-DP
# Add prefix length to ip address
ctrl-ipv4 = 172.23.133.108/24
ctrl-gw-ipv4 = 172.23.133.1
ctrl-interface-name = eth1
lo-ipv4 = 1.2.3.4/32
load-balancer-ipv4 = 2.3.4.5/24
# Add the Autonomous System Number for the BGP routing
local_bgp_asn = 100
remote_bgp_asn = 100

#For configuring the SWu interface
[fast_path_if_1]
if_name = dp0s20
vlan_id = 80
# Add prefix length to ip address
if-ipv4 = 172.24.11.10/24
if-ipv6 = 11::10/64
mtu = 1400

#For configuring the S2b/gtp-u interface
[fast_path_if_2]
if_name = dp0s21
vlan_id = 81
# Add prefix length to ip address
if-ipv4 = 172.24.12.10/24
if-ipv6 = 12::10/64
mtu = 1400

###NOTE###
#If multiple external servers belong to the same subnet, configure only one static route for that subnet.
#If external servers belong to different subnets, configure separate static routes for each subnet/server accordingly.
#To add general routes for IPv4&IPv6 continue the section in incremental order.
#Same followed for IPv6 routes. Example mentioned below IPv6 route sections should start with static_route_ipv6_1

#For configuring the ipv4 static route for external servers.  
[static_route_ipv4_1]
route-ipv4 = 1.1.1.1/32
next-hop-ipv4 = 10.20.1.2

#Route for EMS/trap server
[static_route_ipv4_2]
route-ipv4 = 172.25.1.0/24
next-hop-ipv4 = 192.168.237.1

#Route for tacacs+ server
[static_route_ipv4_3]
route-ipv4 = 192.168.173.137/32
next-hop-ipv4 = 192.168.237.1

#Route for STS ctrl/Data address
[static_route_ipv4_4]
route-ipv4 = 192.168.176.0/24
next-hop-ipv4 = 192.168.237.1

#Route for NTP server
[static_route_ipv4_5]
route-ipv4 = 192.168.111.0/24
next-hop-ipv4 = 192.168.237.1

#For general IPv4 routes
[static_route_ipv4_6]
route-ipv4 = 192.168.173.0/24
next-hop-ipv4 = 192.168.237.1

#For configuring the ssh port
[ssh]
port = 222
local-usr-ssh-port = 22

[snmp]
listen-address-ipv4 = 192.168.122.79
trap-target-ipv4 = 1.1.1.1
# For configuring the access-site interface
# uncomment this block when running in local setup
#node-type = EPDGDP
#device-name = EPDGDP1
#region-name = NZ::DL
#my-ipv4 = 192.168.122.79
#peer-ipv4 = 0.0.0.0
#vip-ipv4 = 0.0.0.0
#my-ipv6 = 2001:db8::123.123.123.123
#peer-ipv6 = 2001:db8::1234:5678:5.6.7.8
#geosite-type = PR
#peer-host-name = None
#self-host-name = None
#pr1-ipv4 = 0.0.0.0
#pr2-ipv4 = 0.0.0.0
#gr1-ipv4 = 0.0.0.0
#gr2-ipv4 = 0.0.0.0

#For configuring the tacacs server details
[tacacs_1]
tacacs-server-ipv4 = 192.168.173.62
port = 49
password = testing123

#For configuring the sts server details
[sts]
control-address-ipv4 = 192.168.176.53
control-port = 8020
data-address-ipv4 = 192.168.176.53
data-port = 8020
self-ipv4 = 192.168.237.52
access-interface = dp0s20
pdn-interface = dp0s21

#For configuring the syslog
[syslog_1]
host-ipv4 = 192.168.111.79
port = 514

#For configuring the backup restoration
[backup_restoration]
host-ipv4 = 1.1.1.1/32
next-hop-ipv4 = 2.2.2.2

#For configuring the ntp server details
[ntp_1]
ntp-server-ipv4 = 192.168.111.79
# min-max poll range (3-11)
min-poll = 3
max-poll = 5

#For configuring the os hardening details
[os_hardening]
login-attempts = 3
login-duration = 60
login-session-timeout = 600
password-length = 8
password-min-class = 3
max-sessions = 50

##***EPDGDP SPECIFIC CONFIG STARTS HERE***##

[epdg_ipsec_profile]
#auth-id = ims
tunnel-local-prefix-ipv4 = 0.0.0.0/0
tunnel-remote-prefix-ipv4 = 0.0.0.0/0
#tunnel-local-prefix-ipv6 = 0::0
#tunnel-remote-prefix-ipv6 = 0::0

[epdg_config]
epdgcp-ipv4 = 172.24.21.10
epdgcp-node1-ipv4 = 172.24.21.8
epdgcp-node2-ipv4 = 172.24.21.9
maximum-subscriber = 25000
home_plmn_mcc = 012
home_plmn_mnc = 123
#gtp-port = 5010
#ike-port = 4000
#The below parameter is used to identify the ePDG-DP node in the cluster. It should be unique across all the nodes in the cluster.
dp-id = 1

[epdg_pcscf_1]
# Add prefix length to subnets, if there is single IP then add prefix length as /32, e.g. 172.24.22.67/32
pcscf-subnet = 172.24.22.0/24

#Note: If there is more than one pcscf subnet then uncomment the below lines and add the subnet. If more than 2 then add a new section and parameters like below.
# [epdg_pcscf_2]
# pcscf-subnet = 172.24.23.0/24

[epdg_imsdp_1]
# Add prefix length to subnets, if there is single IP then add prefix length as /32, e.g. 172.24.22.67/32
imsdp-subnet = 172.24.24.0/24

#Note: If there is more than one imsdp subnet then uncomment the below lines and add the subnet. If more than 2 then add a new section and parameters like below.
# [epdg_imsdp_2]
# imsdp-subnet = 172.24.25.0/24

[epdg_pgwdp_1]
# Add prefix length to subnets, if there is single IP then add prefix length as /32, e.g. 172.24.22.67/32
pgwdp-subnet = 172.24.23.0/24
next-hop-ipv4 = 172.24.12.1

#Note: If there is more than one pgwdp subnet then uncomment the below lines and add the subnet. If more than 2 then add a new section and parameters like below.
# [epdg_pgwdp_2]
# pgwdp-subnet = 172.24.24.0/24
# next-hop-ipv4 = 172.24.12.1

#HAF specific configurations for Multiple DP. It should be same across all the nodes in the cluster. The same number of node entries should be same across all the nodes in the cluster.
[epdg_node_1]
id = 1
#There is not need of prefix length and no sub-net.
dp-ctrl-ipv4 = 172.23.133.108

#Note: If there is more than one ePDG-DP nodes in the clsuter then uncomment the below lines. If more than 2 then add a new section and parameters like below.
[epdg_node_2]
id = 2
dp-ctrl-ipv4 = 172.23.133.118

